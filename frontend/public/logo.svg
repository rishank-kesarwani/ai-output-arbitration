<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="logoShield" x1="12" y1="9" x2="36" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#logoBg)" />
    <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#ffffff" stroke-opacity="0.25" />
    
    <!-- Shield -->
    <path d="M20 7.5 L10 11.5 V20 C10 26.5 14.3 32.5 20 34.5 C25.7 32.5 30 26.5 30 20 V11.5 L20 7.5 Z"
          fill="url(#logoShield)"
          stroke="#ffffff"
          stroke-opacity="0.4"
          stroke-width="1.2" />
    
    <!-- Pillar & Base -->
    <path d="M20 13 V27 M16 27 H24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- Scales Beam -->
    <path d="M14 16.5 L20 15 L26 16.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    <!-- Left / Right Pans -->
    <path d="M14 16.5 V20 M12 20 H16" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M26 16.5 V20 M24 20 H28" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Center Node -->
    <circle cx="20" cy="15" r="2" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(56, 12)">
    <!-- Primary Title -->
    <text x="0" y="14" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">
      AI Output Arbitration
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="0.02em">
      Trust Layer &amp; Verification Engine
    </text>
  </g>
</svg>
