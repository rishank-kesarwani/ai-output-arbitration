<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="20" y1="24" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Shield Shape -->
  <path d="M32 12 L16 18 V31 C16 41.5 22.8 51.2 32 54 C41.2 51.2 48 41.5 48 31 V18 L32 12 Z"
        fill="url(#shieldGrad)"
        stroke="#ffffff"
        stroke-opacity="0.4"
        stroke-width="1.5"
        stroke-linejoin="round" />

  <!-- Central Verification Pillar -->
  <path d="M32 20 V42 M26 42 H38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Balanced Scales Beam -->
  <path d="M22 25.5 L32 23 L42 25.5" stroke="url(#beamGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Scale Pan -->
  <path d="M22 25.5 V30 M19 30 H25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Right Scale Pan -->
  <path d="M42 25.5 V30 M39 30 H45" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Center Fulcrum Star / Node -->
  <circle cx="32" cy="23" r="3" fill="#38bdf8" />
  <circle cx="32" cy="23" r="1.5" fill="#ffffff" />
</svg>
